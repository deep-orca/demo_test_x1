[project]
name = "tst"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Egor Dmitrenkov", email = "deep.orca@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.2.3",
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "faststream[rabbit]>=0.7.8",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
tst = "tst:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
